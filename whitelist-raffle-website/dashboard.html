<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Team dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
  <img class="top-pic" src="hero.png" alt="3DRaffles">
<body>
  <div class="wrap">
   <header>
  <div class="logo">3DRAFFLES</div>
  <nav class="nav">
    <a href="/">Home</a>
    <a href="raffles.html">Raffles</a>
    <a href="teams.html">Teams</a>
    <a href="collabs.html">Collabs</a>
    <a href="winners.html">Winners</a>
    <a href="/auth/discord">Login with Discord</a>
  </nav>
</header>
    <section class="hero">
      <h1 id="title">Dashboard</h1>
      <p id="stats" class="meta"></p>
    </section>
    <section class="grid" id="members"></section>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    fetch('/api/teams/' + params.get('id') + '/dashboard')
      .then(r => r.json())
      .then(data => {
        if (data.error) {
          document.getElementById('title').textContent = data.error;
          return;
        }
        document.getElementById('title').textContent = data.team.name;
        document.getElementById('stats').textContent =
          data.activeRaffles + ' active raffles • ' +
          data.endedRaffles + ' ended • ' +
          data.entries + ' entries • ' +
          data.collabs + ' collabs';
        document.getElementById('members').innerHTML = data.members.map(member =>
          '<article class="card"><div class="card-body"><div class="status">' + member.role +
          '</div><h3>' + (member.username || 'Member') + '</h3><p class="meta">' +
          member.discordId + '</p></div></article>'
        ).join('');
      });
  </script>
 <footer class="site-footer">
  <div class="footer-inner">
    <div class="footer-logo">
      <img src="logo.png" alt="3DRaffles" style="max-width:180px;">
    </div>

    <div class="footer-links">
      <a href="about.html">About Us</a>
      <a href="contact.html">Contact Us</a>
      <a href="news.html">News</a>
      <a href="privacy.html">Privacy</a>
    </div>

    <div class="footer-social">
  <p>Follow Us On:</p>
  <div style="display:flex; gap:12px; align-items:center;">
    <a href="https://wa.me/yournumber" target="_blank">
      <img src="whatsapp.png" alt="WhatsApp" style="width:32px; height:32px;">
    </a>
    <a href="https://t.me/yourtelegram" target="_blank">
      <img src="telegram.png" alt="Telegram" style="width:32px; height:32px;">
    </a>
    <a href="https://x.com/3DCeasedNFT?s=20" target="_blank">
      <img src="x.png" alt="X" style="width:32px; height:32px;">
    </a>
  </div>
  <p style="margin-top:12px; font-size:13px;">© 2026 by 3DCeased</p>
</div>
    </div>
  </div>
</footer>
</body>
</html>
